[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-fabric"
version = "0.4.0"
description = "A window-routed, focus-safe execution fabric for multi-agent computer control with ToDesk integration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agent Control Fabric contributors" }]
dependencies = []

[project.scripts]
acf = "agent_control_fabric.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
